name: Build LaPrint (C# Windows EXE)

# 솔루션이 빌드되기 전까지는 수동 실행만. (푸시 트리거는 Core·App 구현이 끝난 뒤 켠다)
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      # 자동 회귀 테스트: 브라우저판에서 뽑은 골든 기준값과 대조 (실패 시 빌드 중단 — 검증된 계산 보호)
      - name: Run core tests
        run: >
          dotnet test csharp/tests/LaPrint.Core.Tests -c Release --nologo
          --logger "trx;LogFileName=test-results.trx"
          --logger "console;verbosity=normal"

      # 테스트 결과 증적 보관 (밸리데이션 객관적 증거 자료)
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: "**/TestResults/*.trx"

      # .NET 런타임 포함 단일 실행 파일 (사용 PC에 .NET 설치 불필요)
      - name: Publish self-contained single-file exe
        run: >
          dotnet publish csharp/src/LaPrint.App -c Release -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:SatelliteResourceLanguages=ko
          -o publish

      - name: Smoke check
        shell: pwsh
        run: |
          if (-not (Test-Path "publish/LaPrint.exe")) {
            Write-Error "LaPrint.exe가 생성되지 않았습니다."
            exit 1
          }
          "{0:N1} MB" -f ((Get-Item publish/LaPrint.exe).Length / 1MB)

      - name: Resolve version label
        id: version
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq "tag") {
            "label=${{ github.ref_name }}" >> $env:GITHUB_OUTPUT
          } else {
            $short = "${{ github.sha }}".Substring(0, 7)
            "label=$short" >> $env:GITHUB_OUTPUT
          }

      - name: Package zip
        shell: pwsh
        run: >
          Compress-Archive -Path publish/*
          -DestinationPath "LaPrint-win-x64-${{ steps.version.outputs.label }}.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: LaPrint-win-x64-${{ steps.version.outputs.label }}
          path: LaPrint-win-x64-${{ steps.version.outputs.label }}.zip
          retention-days: 30

      # 항상 최신 빌드를 'latest-build' 릴리스에 게시 (Releases 페이지에서 바로 다운로드)
      - name: Publish rolling release
        if: github.ref_type != 'tag'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-build
          name: "Latest Build (자동 빌드)"
          body: |
            GitHub Actions가 자동 빌드한 최신 실행 파일입니다.
            - `LaPrint-win-x64-*.zip`을 풀고 `LaPrint.exe`를 실행하세요 (.NET 설치 불필요, 단일 실행 파일)
            - 처음 실행하면 안내창이 뜹니다. [샘플 데이터로 체험]으로 폴더 지정 없이 바로 써 볼 수 있습니다.
          files: LaPrint-win-x64-${{ steps.version.outputs.label }}.zip
          prerelease: true

      - name: Create GitHub Release (tags only)
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: LaPrint-win-x64-${{ steps.version.outputs.label }}.zip
          generate_release_notes: true
